# Smoke config for cybench on sm.
# Runs 8 sm cases (10% smoke, varied failure modes).
# Overrides inherit the rest from config.example.toml in this dir.
#
# Run:  uv run harness/eval_cybench.py harness/configs/cybench/sm/smoke.toml

# Example cybench harness config.
#
# Run from the repository root:
#   python3 harness/eval_cybench.py harness/configs/cybench/sm/config.example.toml --no-tui

model = "gpt-5.5"
provider = "openai"
# api_key_env = "OPENAI_API_KEY"

# cybench_repo = "https://github.com/andyzorigin/cybench.git"
# cybench_commit = "main"
# max_iterations = 15

outdir = "output/sm/cybench/smoke"

project = "sm"
instances = ["1791520", "1810711", "1814899", "1821959", "1827073", "1834711", "1842617", "1862473"]

timeout = 5400
prompt_template = "../prompts/baseline/task_prompt_sm.j2"
agents_md       = "../prompts/baseline/AGENTS_sm.j2"
images_dir      = "../../projects"
