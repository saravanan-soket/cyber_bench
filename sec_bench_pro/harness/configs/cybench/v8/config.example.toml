# Example cybench harness config.
#
# Run from the repository root:
#   python3 harness/eval_cybench.py harness/configs/cybench/v8/config.example.toml --no-tui

model = "gpt-5.5"
provider = "openai"
# api_key_env = "OPENAI_API_KEY"

# cybench_repo = "https://github.com/andyzorigin/cybench.git"
# cybench_commit = "main"
# max_iterations = 15

outdir = "output/v8/cybench/example/gpt-5.5"

project = "v8"
instances = ["472139305"]

timeout = 5400
prompt_template = "../prompts/baseline/task_prompt_v8.j2"
agents_md       = "../prompts/baseline/AGENTS_v8.j2"
images_dir      = "../../projects"
