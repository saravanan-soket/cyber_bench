# Example openhands harness config.
#
# Run from the repository root:
#   python3 harness/eval_openhands.py harness/configs/openhands/v8/config.example.toml --no-tui

model = "gpt-5.5"
provider = "openai"
# api_key_env = "OPENAI_API_KEY"

# openhands_version = "0.47.0"
# max_iterations = 100

outdir = "output/v8/openhands/example/gpt-5.5"

project = "v8"
instances = ["472139305"]

timeout = 5400
prompt_template = "../prompts/baseline/task_prompt_v8.j2"
