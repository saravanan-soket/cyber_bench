# Example openhands harness config.
#
# Run from the repository root:
#   python3 harness/eval_openhands.py harness/configs/openhands/linux/config.example.toml --no-tui

model = "gpt-5.5"
provider = "openai"
# api_key_env = "OPENAI_API_KEY"

# openhands_version = "0.47.0"
# max_iterations = 100

outdir = "output/linux/openhands/example/gpt-5.5"

project = "linux"
instances = ["CVE-2024-26581"]

timeout = 5400
prompt_template = "../prompts/baseline/task_prompt_linux.j2"
agents_md       = "../prompts/baseline/AGENTS_linux.j2"
images_dir      = "../../projects"
