# Smoke config for openhands on sm.
# Runs ["1791520", "1810711", "1814899"] — one case per failure mode.
# Overrides inherit the rest from config.example.toml in this dir.
#
# Run:  uv run harness/eval_openhands.py harness/configs/openhands/sm/smoke.toml

# Example openhands harness config.
#
# Run from the repository root:
#   python3 harness/eval_openhands.py harness/configs/openhands/sm/config.example.toml --no-tui

model = "gpt-5.5"
provider = "openai"
# api_key_env = "OPENAI_API_KEY"

# openhands_version = "0.47.0"
# max_iterations = 100

outdir = "output/sm/openhands/smoke"

project = "sm"
instances = ["1791520", "1810711", "1814899"]

timeout = 5400
prompt_template = "../prompts/baseline/task_prompt_sm.j2"
agents_md       = "../prompts/baseline/AGENTS_sm.j2"
images_dir      = "../../projects"
