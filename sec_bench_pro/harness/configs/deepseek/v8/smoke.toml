# Smoke config for deepseek on v8.
# Runs 10 v8 cases (10% smoke, varied failure modes).
# Overrides inherit the rest from config.example.toml in this dir.
#
# Run:  uv run harness/eval_deepseek.py harness/configs/deepseek/v8/smoke.toml

# Example DeepSeek Harness (dsh) config.
#
#   python3 harness/eval_deepseek.py harness/configs/deepseek/v8/config.example.toml --no-tui
#
# Relative paths are resolved from the harness/ directory.

# Same model as the other harness configs, so results compare harnesses, not models.
# Non-DeepSeek providers are routed through dsh's bundled pi-ai adapter.
model = "gpt-5.5"
provider = "openai"          # "deepseek-official" or a pi-ai provider id: openai | anthropic | google | openrouter
# api_key_env = "OPENAI_API_KEY"
# reasoning_effort = "high"
# dsh_version = "0.2.2-rc.5"

# Native DeepSeek route (uses DEEPSEEK_API_KEY):
# provider = "deepseek-official"
# model = "deepseek-v4-pro"

# Web search/fetch is disabled so the agent cannot look up published fixes.
# allow_web = false

outdir = "output/v8/deepseek/smoke"

project = "v8"
instances = ["324596281", "324747822", "325866363", "325893559", "327740539", "329130358", "334120897", "336009921", "340221135", "343748812"]
# instances = "__verified__"

timeout = 5400
prompt_template = "../prompts/baseline/task_prompt_v8.j2"
agents_md       = "../prompts/baseline/AGENTS_v8.j2"
images_dir      = "../../projects"
