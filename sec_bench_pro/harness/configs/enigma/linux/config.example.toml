# Example enigma harness config.
#
# Run from the repository root:
#   python3 harness/eval_enigma.py harness/configs/enigma/linux/config.example.toml --no-tui

model = "gpt-5.5"
provider = "openai"
# api_key_env = "OPENAI_API_KEY"

# enigma_repo = "https://github.com/princeton-nlp/SWE-agent.git"
# enigma_commit = "main"
# cost_limit = 3.0

outdir = "output/linux/enigma/example/gpt-5.5"

project = "linux"
instances = ["CVE-2024-26581"]

timeout = 5400
prompt_template = "../prompts/baseline/task_prompt_linux.j2"
agents_md       = "../prompts/baseline/AGENTS_linux.j2"
images_dir      = "../../projects"
