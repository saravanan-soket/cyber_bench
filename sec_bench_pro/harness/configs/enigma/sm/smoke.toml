# Smoke config for enigma on sm.
# Runs ["1791520", "1810711", "1814899"] — one case per failure mode.
# Overrides inherit the rest from config.example.toml in this dir.
#
# Run:  uv run harness/eval_enigma.py harness/configs/enigma/sm/smoke.toml

# Example enigma harness config.
#
# Run from the repository root:
#   python3 harness/eval_enigma.py harness/configs/enigma/sm/config.example.toml --no-tui

model = "gpt-5.5"
provider = "openai"
# api_key_env = "OPENAI_API_KEY"

# enigma_repo = "https://github.com/princeton-nlp/SWE-agent.git"
# enigma_commit = "main"
# cost_limit = 3.0

outdir = "output/sm/enigma/smoke"

project = "sm"
instances = ["1791520", "1810711", "1814899"]

timeout = 5400
prompt_template = "../prompts/baseline/task_prompt_sm.j2"
agents_md       = "../prompts/baseline/AGENTS_sm.j2"
images_dir      = "../../projects"
