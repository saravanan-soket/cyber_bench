# Example pi harness config.
#
#   python3 harness/eval_pi.py harness/configs/pi/sm/config.example.toml --no-tui
#
# Relative paths are resolved from the harness/ directory.

# Same model as the other harness configs, so results compare harnesses, not models.
model = "gpt-5.5"
provider = "openai"          # pi provider id: openai | anthropic | deepseek | google | openrouter
# api_key_env = "OPENAI_API_KEY"
# thinking = "high"          # off | minimal | low | medium | high | xhigh | max
# pi_version = "1.6.0"

# Native DeepSeek model through pi:
# provider = "deepseek"
# model = "deepseek-v4-pro"

outdir = "output/sm/pi/example/gpt-5.5"

project = "sm"
instances = ["1880719"]
# instances = "__verified__"

timeout = 5400
prompt_template = "../prompts/baseline/task_prompt_sm.j2"
agents_md       = "../prompts/baseline/AGENTS_sm.j2"
images_dir      = "../../projects"
