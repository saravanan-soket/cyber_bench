# Smoke config for loop on v8.
# Runs 10 v8 cases (10% smoke, varied failure modes).
# Overrides inherit the rest from config.example.toml in this dir.
#
# Run:  uv run harness/eval_loop.py harness/configs/loop/v8/smoke.toml

# Example loop harness config.
#
# Run from the repository root:
#   uv run harness/eval_loop.py harness/configs/loop/v8/config.example.toml
#   python3 harness/eval_loop.py harness/configs/loop/v8/config.example.toml --no-tui
#
# Relative paths are resolved from the harness/ directory.

# ---- Model and provider ------------------------------------------------------
# provider is the loop provider id. model is whatever that provider accepts.
# The matching API-key env var is auto-forwarded into the container
# (OPENAI_API_KEY for openai, ANTHROPIC_API_KEY for anthropic, SOKET_API_KEY
# for soket, etc.). You can override the var with `api_key_env`.

model = "gpt-5.5"
provider = "openai"
# api_key_env = "OPENAI_API_KEY"

# Optionally pin the loop CLI version installed in the container.
# loop_version = "0.6.0"

outdir = "output/v8/loop/smoke"

# ---- Benchmark selection -----------------------------------------------------
project = "v8"
instances = ["324596281", "324747822", "325866363", "325893559", "327740539", "329130358", "334120897", "336009921", "340221135", "343748812"]

# ---- Runtime and inputs ------------------------------------------------------
timeout = 5400  # 90 minutes
prompt_template = "../prompts/baseline/task_prompt_v8.j2"
agents_md       = "../prompts/baseline/AGENTS_v8.j2"
images_dir      = "../../projects"

# privileged defaults to true for linux projects, false otherwise. Override
# here if you need the opposite.
# privileged = false
