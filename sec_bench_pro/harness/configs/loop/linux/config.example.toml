# Example loop harness config.
#
# Run from the repository root:
#   uv run harness/eval_loop.py harness/configs/loop/linux/config.example.toml
#   python3 harness/eval_loop.py harness/configs/loop/linux/config.example.toml --no-tui
#
# Relative paths are resolved from the harness/ directory.

# ---- Model and provider ------------------------------------------------------
# provider is the loop provider id. model is whatever that provider accepts.
# The matching API-key env var is auto-forwarded into the container
# (OPENAI_API_KEY for openai, ANTHROPIC_API_KEY for anthropic, SOKET_API_KEY
# for soket, etc.). You can override the var with `api_key_env`.

model = "gpt-5.5"
provider = "openai"
# api_key_env = "OPENAI_API_KEY"

# Optionally pin the loop CLI version installed in the container.
# loop_version = "0.6.0"

outdir = "output/linux/loop/example/gpt-5.5"

# ---- Benchmark selection -----------------------------------------------------
project = "linux"
instances = ["placeholder_linux_instance"]

# ---- Runtime and inputs ------------------------------------------------------
timeout = 5400  # 90 minutes
prompt_template = "../prompts/baseline/task_prompt_linux.j2"
agents_md       = "../prompts/baseline/AGENTS_linux.j2"
images_dir      = "../../projects"

# privileged defaults to true for linux projects, false otherwise. Override
# here if you need the opposite.
# privileged = false
