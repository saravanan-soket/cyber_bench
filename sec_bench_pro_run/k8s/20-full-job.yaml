apiVersion: batch/v1
kind: Job
metadata: {name: sec-bench-full, namespace: eka-bench}
spec:
  completions: 100
  parallelism: 100
  completionMode: Indexed
  backoffLimit: 400
  backoffLimitPerIndex: 1
  template:
    metadata: {labels: {app: sec-bench-full}}
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: kubernetes.io/hostname, operator: NotIn, values: [soketlab-worker002, soketlab-worker018]}
      containers:
      - name: dind
        image: docker:27-dind
        securityContext: {privileged: true}
        env: [{name: DOCKER_TLS_CERTDIR, value: ""}]
        args: ["--host=unix:///dockersock/docker.sock"]
        resources: {requests: {cpu: "4", memory: 12Gi}, limits: {cpu: "8", memory: 24Gi}}
        volumeMounts:
        - {name: projects, mountPath: /projects/data}
        - {name: dockersock, mountPath: /dockersock}
        - {name: dockerstore, mountPath: /var/lib/docker}
      - name: agent
        image: python:3.12-bookworm
        env:
        - {name: DOCKER_HOST, value: "unix:///dockersock/docker.sock"}
        - {name: SHARD_COUNT, value: "100"}
        resources: {requests: {cpu: "2", memory: 6Gi}, limits: {cpu: "4", memory: 12Gi}}
        volumeMounts:
        - {name: projects, mountPath: /projects/data}
        - {name: dockersock, mountPath: /dockersock}
        command: ["bash","-lc"]
        args:
        - |
          set -u
          ROOT=/projects/data/datasets/code_data/cyber_bench
          OUT="$ROOT/sec_bench_pro_run/traces"
          mkdir -p "$ROOT/sec_bench_pro_run/logs"
          IDX="${JOB_COMPLETION_INDEX}"
          LOG="$ROOT/sec_bench_pro_run/logs/full-shard-${IDX}.log"
          exec > >(tee -a "$LOG") 2>&1
          echo "shard=$IDX start=$(date -u +%FT%TZ)"
          apt-get update -qq && apt-get install -y -qq docker.io curl ca-certificates >/dev/null
          pip install -q jinja2
          for i in $(seq 1 60); do docker info >/dev/null 2>&1 && break; sleep 2; done
          docker info | head -3
          cd "$ROOT/sec_bench_pro_run"
          # Pre-prune docker cache between instances is done inside agent_runner's teardown (rm -f).
          # Each pod handles ~2-3 instances via sharding (225 / 100).
          python3 agent_runner.py \
            --out-dir "$OUT" \
            --base-url http://172.17.98.19:8000/v1 \
            --model eka-sft7-w3000 \
            --projects v8,sm \
            --shard-count 100 \
            --max-turns 100 \
            --task-deadline 3600 \
            --bash-timeout 120 \
            --ctx-budget 56000 \
            --max-tokens 16000 \
            --concurrency 1
          # Reclaim docker disk after run (helps next-pod warm pods; emptyDir cleans on teardown anyway).
          docker system prune -af >/dev/null 2>&1 || true
          echo "done=$(date -u +%FT%TZ)"
          exit 0
      volumes:
      - {name: projects,    hostPath: {path: /projects/data, type: Directory}}
      - {name: dockersock,  emptyDir: {}}
      - {name: dockerstore, emptyDir: {sizeLimit: 40Gi}}
