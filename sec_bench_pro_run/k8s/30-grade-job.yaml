apiVersion: v1
kind: Pod
metadata: {name: sec-bench-grade, namespace: eka-bench}
spec:
  restartPolicy: Never
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - {key: kubernetes.io/hostname, operator: NotIn, values: [soketlab-worker002, soketlab-worker018]}
  containers:
  - name: dind
    image: docker:27-dind
    securityContext: {privileged: true}
    env: [{name: DOCKER_TLS_CERTDIR, value: ""}]
    args: ["--host=unix:///dockersock/docker.sock"]
    resources: {requests: {cpu: "8", memory: 24Gi}, limits: {cpu: "16", memory: 48Gi}}
    volumeMounts:
    - {name: projects, mountPath: /projects/data}
    - {name: dockersock, mountPath: /dockersock}
    - {name: dockerstore, mountPath: /var/lib/docker}
  - name: grader
    image: python:3.12-bookworm
    env:
    - {name: DOCKER_HOST,     value: "unix:///dockersock/docker.sock"}
    - {name: OPENAI_API_BASE, value: "http://172.17.98.99:8000/v1"}
    - {name: OPENAI_API_KEY,  value: "EMPTY"}
    - {name: SECB_JS_LLM_CALL_BUDGET, value: "4000"}
    resources: {requests: {cpu: "4", memory: 12Gi}, limits: {cpu: "8", memory: 24Gi}}
    volumeMounts:
    - {name: projects, mountPath: /projects/data}
    - {name: dockersock, mountPath: /dockersock}
    command: ["bash","-lc"]
    args:
    - |
      set -eux
      ROOT=/projects/data/datasets/code_data/cyber_bench
      SBP=$ROOT/sec_bench_pro
      TARGET=$ROOT/sec_bench_pro_run/traces
      OUT=$ROOT/sec_bench_pro_run/grade
      mkdir -p "$OUT"
      LOG="$OUT/run.log"
      exec > >(tee -a "$LOG") 2>&1

      apt-get update -qq && apt-get install -y -qq docker.io curl ca-certificates git >/dev/null
      # Use the sec_bench_pro repo's own venv (has litellm etc.)
      source "$SBP/.venv/bin/activate"
      # Confirm litellm present
      python -c "import litellm; print('litellm imported')"

      # Wait for DinD
      for i in $(seq 1 90); do docker info >/dev/null 2>&1 && break; sleep 2; done
      docker info | head -3

      cd "$SBP"
      # Clean any previous result/ subdirs so grading starts fresh
      find "$TARGET" -maxdepth 2 -name result -type d -exec rm -rf {} + 2>/dev/null || true
      # Run grader for each project. --pull-missing will fetch vuln+fixed images per instance as needed.
      for PROJ in v8 sm; do
        echo "========== GRADING $PROJ =========="
        python harness/grade.py \
          --project $PROJ \
          --target-dir "$TARGET" \
          --judge-model "openai/GLM-5.3" \
          --pull-missing \
          --workers 4 \
          --judge-workers 16 \
          --attempts 1 \
          --timeout 180 \
          --js-grading-time-budget 21600 \
          --out-dir "$OUT/$PROJ" 2>&1 | tee -a "$OUT/grade_$PROJ.log" || echo "grade.py $PROJ exit=$?"
        echo "========== $PROJ DONE =========="
      done
      # Reclaim docker disk
      docker system prune -af >/dev/null 2>&1 || true
      echo "all done $(date -u +%FT%TZ)"
      exit 0
  volumes:
  - {name: projects,    hostPath: {path: /projects/data, type: Directory}}
  - {name: dockersock,  emptyDir: {}}
  - {name: dockerstore, emptyDir: {sizeLimit: 2000Gi}}
