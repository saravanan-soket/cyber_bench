apiVersion: batch/v1
kind: Job
metadata: {name: eka-cybergym-empty-rerun, namespace: eka-bench}
spec:
  completionMode: Indexed
  completions: 32
  parallelism: 32
  backoffLimitPerIndex: 2
  maxFailedIndexes: 32
  activeDeadlineSeconds: 14400
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: kubernetes.io/hostname, operator: NotIn, values: [soketlab-worker002, soketlab-worker018]}
      containers:
      - name: agent
        image: python:3.12-bookworm
        resources: {requests: {cpu: "2", memory: 4Gi}, limits: {cpu: "4", memory: 10Gi}}
        env: [{name: SHARD_COUNT, value: "32"}]
        command: ["bash","-lc"]
        args:
        - |
          TD=/projects/data/datasets/code_data/cyber_bench/run/tasks_empty_rerun
          for i in $(seq 1 24); do [ -d "$TD" ] && [ "$(ls "$TD" 2>/dev/null | wc -l)" -gt 0 ] && break; echo "waiting for data ($i)"; sleep 5; done
          [ -d "$TD" ] || { echo "DATA NOT VISIBLE on $(hostname)"; exit 1; }
          python3 /app/agent_runner.py \
            --tasks-dir $TD \
            --trace-dir /projects/data/datasets/code_data/cyber_bench/run/traces_empty_rerun \
            --poc-dir /projects/data/datasets/code_data/cyber_bench/run/pocs_empty_rerun \
            --base-url http://172.17.98.19:8000/v1 --model eka-sft7-w3000 \
            --concurrency 2 --max-turns 100 --bash-timeout 120 --task-deadline 3600
        volumeMounts:
        - {name: code, mountPath: /app}
        - {name: projects, mountPath: /projects/data}
      volumes:
      - {name: code, configMap: {name: agent-code-rerun}}
      - {name: projects, hostPath: {path: /projects/data, type: Directory}}
