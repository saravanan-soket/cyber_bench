apiVersion: v1
kind: Pod
metadata:
  name: eka-probe
  namespace: eka-bench
spec:
  restartPolicy: Never
  containers:
  - name: probe
    image: python:3.12-bookworm
    resources:
      requests: {cpu: "1", memory: 1Gi}
      limits: {cpu: "1", memory: 1Gi}
    command: ["bash","-lc"]
    args:
    - |
      echo "== eka reachability ==";
      curl -s -m 8 http://172.17.98.19:8000/v1/models | head -c 160; echo;
      echo "== hostPath =="; ls /projects/data/datasets/code_data/cyber_bench/run/tasks_all | wc -l | xargs echo bundles:;
      echo "== tools =="; which gcc python3 curl tar file;
    volumeMounts:
    - {name: projects, mountPath: /projects/data}
  volumes:
  - name: projects
    hostPath: {path: /projects/data, type: Directory}
