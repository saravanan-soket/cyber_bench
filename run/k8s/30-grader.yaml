apiVersion: v1
kind: Pod
metadata: {name: cybergym-grader, namespace: eka-bench}
spec:
  restartPolicy: Never
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - {key: kubernetes.io/hostname, operator: NotIn, values: [soketlab-worker002, soketlab-worker018]}
  containers:
  - name: dind
    image: docker:27-dind
    securityContext: {privileged: true}
    env: [{name: DOCKER_TLS_CERTDIR, value: ""}]
    args: ["--host=unix:///dockersock/docker.sock"]
    resources: {requests: {cpu: "6", memory: 12Gi}, limits: {cpu: "12", memory: 24Gi}}
    volumeMounts:
    - {name: projects, mountPath: /projects/data}
    - {name: dockerstore, mountPath: /var/lib/docker}
    - {name: dockersock, mountPath: /dockersock}
  - name: server
    image: python:3.12-bookworm
    env:
    - {name: DOCKER_HOST, value: "unix:///dockersock/docker.sock"}
    - {name: PYTHONPATH, value: "/projects/data/datasets/code_data/cyber_bench/cybergym/src"}
    - {name: CYBERGYM_API_KEY, value: "cybergym-030a0cd7-5908-4862-8ab9-91f2bfc7b56d"}
    - {name: SERVER, value: "http://127.0.0.1:8666"}
    - {name: DBPATH, value: "/projects/data/datasets/code_data/cyber_bench/run/grade/poc.db"}
    resources: {requests: {cpu: "4", memory: 8Gi}, limits: {cpu: "8", memory: 16Gi}}
    command: ["bash","-lc"]
    args:
    - |
      set -e
      pip install --quiet --root-user-action=ignore fastapi "uvicorn[standard]" sqlalchemy docker python-multipart httpx pydantic pydantic-settings simple-parsing 2>&1 | tail -1
      python /app/grade_prep.py
      mkdir -p /projects/data/datasets/code_data/cyber_bench/run/grade/pocs_server
      python -m cybergym.server --host 127.0.0.1 --port 8666 --mask_map_path /projects/data/datasets/code_data/cyber_bench/run/data/mask_map_all.json --log_dir /projects/data/datasets/code_data/cyber_bench/run/grade/pocs_server --db_path /projects/data/datasets/code_data/cyber_bench/run/grade/poc.db --binary_dir /projects/data/datasets/code_data/cyber_bench/run/data/cybergym-server-data/cybergym-server-data &
      for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8666/docs && break; sleep 2; done
      echo "server up; starting grader"
      python /app/grade_client.py
      echo "GRADING_DONE"
    volumeMounts:
    - {name: projects, mountPath: /projects/data}
    - {name: code, mountPath: /app}
    - {name: dockersock, mountPath: /dockersock}
  volumes:
  - {name: projects, hostPath: {path: /projects/data, type: Directory}}
  - {name: dockerstore, emptyDir: {}}
  - {name: dockersock, emptyDir: {}}
  - {name: code, configMap: {name: cybergym-grade-client}}
