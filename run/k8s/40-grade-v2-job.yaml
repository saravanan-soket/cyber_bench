apiVersion: v1
kind: Pod
metadata: {name: grade-v2, namespace: eka-bench}
spec:
  restartPolicy: Never
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - {key: kubernetes.io/hostname, operator: NotIn, values: [soketlab-worker002, soketlab-worker018]}
  containers:
  - name: grader
    image: python:3.12-bookworm
    env:
    - {name: SERVER, value: "http://cybergym-server:8666"}
    - {name: DBPATH, value: "/projects/data/datasets/code_data/cyber_bench/run/codex/grade/codex_poc.db"}
    resources: {requests: {cpu: "2", memory: 4Gi}, limits: {cpu: "4", memory: 8Gi}}
    volumeMounts:
    - {name: projects, mountPath: /projects/data}
    command: ["bash","-lc"]
    args:
    - |
      set -eux
      pip install -q httpx sqlalchemy
      cd /projects/data/datasets/code_data/cyber_bench/run
      # Save result to a v2-specific json
      python3 - <<'PY'
      import os
      # patch grade_client output path at runtime by wrapping
      import importlib.util, sys, json, time
      spec = importlib.util.spec_from_file_location("gc", "/projects/data/datasets/code_data/cyber_bench/run/grade_client.py")
      m = importlib.util.module_from_spec(spec)
      # Override its save path by monkeypatching
      PY
      # Simpler: just run it; it writes to grade_results.json in grade/; we'll rename
      python3 grade_client.py 2>&1 | tail -200
      # Move result to v2 path
      if [ -f grade/grade_results.json ]; then
        cp grade/grade_results.json grade/grade_results_v2_100turn_1h.json
        ls -la grade/grade_results_v2_100turn_1h.json
      fi
  volumes:
  - {name: projects, hostPath: {path: /projects/data, type: Directory}}
