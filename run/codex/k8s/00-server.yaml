apiVersion: apps/v1
kind: Deployment
metadata: {name: cybergym-server, namespace: eka-bench}
spec:
  replicas: 1
  selector: {matchLabels: {app: cybergym-server}}
  template:
    metadata: {labels: {app: cybergym-server}}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: kubernetes.io/hostname, operator: NotIn, values: [soketlab-worker002, soketlab-worker018]}
      containers:
      - name: dind
        image: docker:27-dind
        securityContext: {privileged: true}
        env: [{name: DOCKER_TLS_CERTDIR, value: ""}]
        args: ["--host=unix:///dockersock/docker.sock"]
        resources: {requests: {cpu: "6", memory: 12Gi}, limits: {cpu: "16", memory: 32Gi}}
        volumeMounts:
        - {name: projects, mountPath: /projects/data}
        - {name: dockerstore, mountPath: /var/lib/docker}
        - {name: dockersock, mountPath: /dockersock}
      - name: server
        image: python:3.12-bookworm
        env:
        - {name: DOCKER_HOST, value: "unix:///dockersock/docker.sock"}
        - {name: PYTHONPATH, value: "/projects/data/datasets/code_data/cyber_bench/cybergym/src"}
        - {name: CYBERGYM_API_KEY, value: "cybergym-030a0cd7-5908-4862-8ab9-91f2bfc7b56d"}
        resources: {requests: {cpu: "4", memory: 8Gi}, limits: {cpu: "8", memory: 16Gi}}
        command: ["bash","-lc"]
        args:
        - |
          set -e
          pip install --quiet --root-user-action=ignore fastapi "uvicorn[standard]" sqlalchemy docker python-multipart httpx pydantic pydantic-settings simple-parsing 2>&1 | tail -1
          python /app/grade_prep.py
          mkdir -p /projects/data/datasets/code_data/cyber_bench/run/codex/grade
          exec python -m cybergym.server --host 0.0.0.0 --port 8666 --mask_map_path /projects/data/datasets/code_data/cyber_bench/run/data/mask_map_all.json --log_dir /projects/data/datasets/code_data/cyber_bench/run/codex/grade/pocs_server --db_path /projects/data/datasets/code_data/cyber_bench/run/codex/grade/codex_poc.db --binary_dir /projects/data/datasets/code_data/cyber_bench/run/data/cybergym-server-data/cybergym-server-data
        volumeMounts:
        - {name: projects, mountPath: /projects/data}
        - {name: code, mountPath: /app}
        - {name: dockersock, mountPath: /dockersock}
      volumes:
      - {name: projects, hostPath: {path: /projects/data, type: Directory}}
      - {name: dockerstore, emptyDir: {}}
      - {name: dockersock, emptyDir: {}}
      - {name: code, configMap: {name: cybergym-grade-client}}
---
apiVersion: v1
kind: Service
metadata: {name: cybergym-server, namespace: eka-bench}
spec:
  selector: {app: cybergym-server}
  ports: [{port: 8666, targetPort: 8666}]
