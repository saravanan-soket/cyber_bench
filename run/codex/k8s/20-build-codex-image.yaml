apiVersion: v1
kind: Pod
metadata: {name: codex-img-build, namespace: eka-bench}
spec:
  restartPolicy: Never
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - {key: kubernetes.io/hostname, operator: NotIn, values: [soketlab-worker002, soketlab-worker018]}
  containers:
  - name: dind
    image: docker:27-dind
    securityContext: {privileged: true}
    env: [{name: DOCKER_TLS_CERTDIR, value: ""}]
    args: ["--host=unix:///dockersock/docker.sock"]
    resources: {requests: {cpu: "4", memory: 8Gi}, limits: {cpu: "8", memory: 16Gi}}
    volumeMounts:
    - {name: projects, mountPath: /projects/data}
    - {name: dockersock, mountPath: /dockersock}
    - {name: dockerstore, mountPath: /var/lib/docker}
  - name: builder
    image: node:20-bookworm
    env: [{name: DOCKER_HOST, value: "unix:///dockersock/docker.sock"}]
    resources: {requests: {cpu: "4", memory: 8Gi}, limits: {cpu: "8", memory: 16Gi}}
    volumeMounts:
    - {name: projects, mountPath: /projects/data}
    - {name: dockersock, mountPath: /dockersock}
    command: ["bash","-lc"]
    args:
    - |
      set -eux
      ROOT=/projects/data/datasets/code_data/cyber_bench
      CODEX_SRC=$ROOT/cybergym-agent-examples/codex/codex-repo/codex-cli
      OUT_TAR=$ROOT/run/codex/artifacts/cybergym-codex.tar
      mkdir -p "$(dirname "$OUT_TAR")"
      apt-get update -qq && apt-get install -y -qq docker.io curl ca-certificates
      npm install -g pnpm@9 >/dev/null
      for i in $(seq 1 60); do docker info >/dev/null 2>&1 && break; sleep 2; done
      docker info | head -5
      WORK=/tmp/codex-build
      cp -r "$CODEX_SRC" "$WORK"
      cd "$WORK"
      pnpm install --silent
      pnpm run build
      mkdir -p dist
      rm -f dist/openai-codex-*.tgz
      pnpm pack --pack-destination ./dist
      mv dist/openai-codex-*.tgz dist/codex.tgz
      ls -la dist/
      docker build -t cybergym/codex:latest -f Dockerfile.cybergym .
      echo "saving image to $OUT_TAR"
      docker save cybergym/codex:latest -o "$OUT_TAR"
      ls -la "$OUT_TAR"
      echo "BUILD_DONE"
      exit 0
  volumes:
  - {name: projects, hostPath: {path: /projects/data, type: Directory}}
  - {name: dockersock, emptyDir: {}}
  - {name: dockerstore, emptyDir: {}}
