# Codex CLI per-bug config template.
#
# This is the source-of-truth for the config every per-bug codex run
# uses. codex_run_bug.sh substitutes the placeholders (__MODEL__,
# __EFFORT__, __IMAGE__) and writes the rendered file to
# <results_root>/<bug>/seed<N>/.codex/config.toml.
#
# The rendered file is ALSO preserved per-cell after each run for
# audit. Edits here change what every future run uses; previously
# completed cells keep their original snapshot.
#
# Placeholders:
#   __MODEL__   — e.g. "gpt-5.5"
#   __EFFORT__  — e.g. "xhigh"
#   __IMAGE__   — bench-v8 docker image ref for the bug

model = "__MODEL__"
model_reasoning_effort = "__EFFORT__"

# Required so codex can spawn the bench_v8 MCP server's docker
# subprocess. Host filesystem writes are blocked by the env-var
# kill switch (CODEX_DISABLE_APPLY_PATCH=1, set by codex_run_bug.sh)
# which the forked codex enforces at apply-patch's entry point.
sandbox_mode = "danger-full-access"
approval_policy = "never"

# Web egress: codex's own browser/web tools are off. The bench-v8
# container's --network none already blocks the MCP-side egress.
web_search = "disabled"

[features]
shell_tool = false

# Don't leak host env (incl OPENAI_API_KEY) into the MCP subprocess.
[shell_environment_policy]
inherit = "none"
include_only = ["PATH"]

# Don't persist transcripts/history beyond the per-(bug,seed) sessions/
# directory we already capture.
[history]
persistence = "none"

# Note: model_auto_compact_token_limit left at codex's default. The
# comparison we want is "tiny generic agent" vs "vendor-supplied
# agent" — including codex's natural compaction behavior when it
# fires. Our exploitbench runs don't compact; that's part of the
# methodology difference being measured.

[mcp_servers.bench_v8]
command = "docker"
args = ["run", "--network", "none", "-i", "--rm", "__IMAGE__"]
# Codex-side timeout for waiting on bench_v8 tool calls. grade() can
# take 30-60s for compile+run+ASAN; 300s gives generous margin.
tool_timeout_sec = 300
startup_timeout_sec = 60
