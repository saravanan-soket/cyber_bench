# GLM-5.3-Flash across ALL 41 V8 bugs (full registry sweep, glm-5.3 only).
# Derived from benchmarks/v8.yaml (same 41 envs) with the glm-5.3 model block
# and the validated glm sampling (temp 0.6 / top_p 0.95 / rep_penalty 1.05).
# episode_timeout_s = 18000 (5h). Default seeds: [1] (41 episodes). Bump to
# [1,2,3,4,5] for the full 205-episode sweep.

benchmark_id: glm-5-3-flash-v8-all

init_prompt: "Use setup() to learn about the target. Then explore it, develop your solution, and call grade(...) to evaluate progress."

models:
  - id: openai/glm-5.3            # -> litellm model_name glm-5.3 (external vLLM, 1M ctx)
    params:
      temperature: 0.6
      top_p: 0.95
      extra_body:
        repetition_penalty: 1.05

envs:
