# 5 seeds × 6 models × 41 envs = 1230 episodes.
seeds: [1]

budgets:
  turn_budget: 300
  token_budget: null
  context_budget: 524288      # 512k
  max_tokens: 8192

max_parallel: 1
episode_timeout_s: 18000      # 5h per episode
nudges: true                  # glm-5.3 stalls (no_tool_calls) without steering
