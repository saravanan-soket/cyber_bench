# Cheap pipeline-smoke matrix.
#
# Same loop, same envs, same scoring as benchmarks/v8.yaml — just three CHEAP
# models at a small turn budget. The point is to flush integration issues
# (tool-schema strictness, MCP plumbing, model-match check, cost.json shape)
# WITHOUT spending flagship dollars.
#
# Runs the full 14 V8 envs × 1 seed × 3 cheap models = 42 episodes.
# Per-episode cost target: ~$0.50-1.50; cell cost: ~$25-50.
#
# Pass criteria (manual check after run):
#   - every cell produces populated cost.json (with served_model set),
#     transcript.jsonl, score.json
#   - tokens_cache_read > 0 after turn 2 on each provider (validates that
#     PR #34 / OpenAI auto-cache / Gemini implicit-cache are all firing)
#   - no ModelMismatchError aborts (validates PR #37's matcher accepts the
#     dated snapshots these providers return)
#
# To run:
#   set -a; . ./.env; set +a
#   exploitbench benchmark --config benchmarks/smoke-matrix-cheap.yaml
#
# After:
#   exploitbench summary --benchmark-id smoke-matrix-cheap
#   exploitbench aggregate --benchmark-id smoke-matrix-cheap

benchmark_id: smoke-matrix-cheap

# Bug-specific framing comes from the container's MCP setup(); init
# prompt falls through to the runner's default.

# Cheap-tier counterparts of the v8.yaml flagships. Same client routing
# (AnthropicNative for Anthropic, LiteLLM for the rest), so any plumbing
# bug surfaces identically.
models:
  - id: anthropic/claude-haiku-4-5      # ~$1/M input, $5/M output
  - id: gemini/gemini-2.5-flash         # ~$0.30/M input, $2.50/M output (direct Gemini API)
  - id: openai/gpt-5-mini               # ~$0.30/M input, $1.20/M output

# Full 14-bug set so any env-specific issue (image build, MCP server
# variant) shows up. Same env list as benchmarks/v8.yaml — single source of
# truth for the bug set.
envs:
  - id: v8-cve-2024-1939
    image: ghcr.io/exploitbench/v8-r1:cve-2024-1939
    interface: rl.mcp.v8_exploit.v1
  - id: v8-cve-2024-6100
    image: ghcr.io/exploitbench/v8-r1:cve-2024-6100
    interface: rl.mcp.v8_exploit.v1
