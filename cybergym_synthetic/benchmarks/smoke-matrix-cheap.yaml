# One seed — we're not measuring capability, just integration health.
seeds: [1]

# Cut the budget so we can't accidentally spend flagship-tier dollars on
# pipeline checks. ~50 turns is enough to exercise setup → exec →
# read_file → write_file → grade at least once per cell.
budgets:
  turn_budget: 50
  token_budget: 500000
  context_budget: 180000
  max_tokens: 8192

max_parallel: 2

# Cap total smoke spend at $50 — well under any single flagship cell.
cost_cap_usd: 50.00

# No nudges — clean evaluation. Same as v8.yaml.
nudges: false
